seed: 20260910
output_dir: data/
domains: [science, history, medicine, law]
qa_sources: [mmlu, sciq, arc]
sizes:
  t1_discrete: 5000
  t2_graded: 5000
  t3a_inferred_templated: 5000
  t3b_inferred_llm: 2000
name_style_ratio: {personal: 0.34, agentN: 0.33, letter: 0.33}
format_ratio: {same_sentence: 0.5, split_sentence: 0.5}
t3:
  turns_per_transcript: 3
t3b:
  backend: vllm
  base_url: http://localhost:8000/v1
  # One model per build: a vLLM server serves a single model, so listing two
  # here makes the build fail as soon as it cycles onto the one that is not
  # loaded. To build the other (spec section 5.4 compares them), rerun with
  #   models: ["Qwen/Qwen3.5-9B"]
  # against a server hosting it; each model writes its own file, compared later.
  models: ["Qwen/Qwen3-8B"]
  enable_thinking: false
  sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0}
  seed: 20260910
  max_tokens: 120
