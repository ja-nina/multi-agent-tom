[project]
name = "personabind"
version = "0.0.0"
description = "Phase 0 generator for perceived-persona-binding research"
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets",
    "numpy",
    "scipy",
    "pandas",
    # Upper bound guards `sklearn.metrics.cluster.expected_mutual_information`,
    # a PRIVATE API that both name_trait_mi and token_trait_mi use for chance
    # correction; a minor bump could rename or remove it. Re-verify before
    # widening.
    "scikit-learn>=1.6,<1.10",
    "pyyaml",
    "openai",
    "tqdm",
    "torch",
    "transformers",
    "nnsight",
    "nnterp",
]

[project.scripts]
personabind = "personabind.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personabind"]

[tool.pytest.ini_options]
markers = ["integration: hits a real external service; skipped by default"]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py311"
line-length = 100
