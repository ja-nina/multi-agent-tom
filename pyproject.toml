[project]
name = "personabind"
version = "0.0.0"
description = "Phase 0 generator for perceived-persona-binding research"
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets",
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "openai",
    "tqdm",
]

[project.scripts]
personabind = "personabind.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personabind"]

[tool.pytest.ini_options]
markers = ["integration: hits a real external service; skipped by default"]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py311"
line-length = 100
